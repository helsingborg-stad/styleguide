name: Test

on:
  push:
    branches: [main-1.x]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to test.
        required: false
        type: string

jobs:
  jest:
    name: Jest
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/test-dependencies
        with:
          node: 'true'
      - name: Run Jest
        id: jest
        env:
          JEST_JUNIT_OUTPUT_DIR: test-results
          JEST_JUNIT_OUTPUT_NAME: jest.xml
        run: npm test -- --watch=false --reporters=default --reporters=jest-junit --coverageReporters=html --coverageReporters=lcov --coverageReporters=json-summary
      - name: Publish Jest report
        if: ${{ !cancelled() && inputs.ref == '' && hashFiles('test-results/jest.xml') != '' }}
        uses: dorny/test-reporter@v1
        with:
          name: Jest results
          path: test-results/jest.xml
          reporter: jest-junit
          fail-on-error: true
      - name: Upload Jest report and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jest-report-and-coverage
          path: |
            test-results/jest.xml
            coverage
          if-no-files-found: warn

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/test-dependencies
        with:
          node: 'true'
      - run: npm run typecheck

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/test-dependencies
        with:
          node: 'true'
      - run: npm run lint:scss
      - name: Upload Stylelint report
        if: ${{ !cancelled() && hashFiles('stylelint.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: stylelint-report
          path: stylelint.log

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/test-dependencies
        with:
          php: 'true'
      - name: Run PHPUnit
        run: |
          mkdir -p test-results
          XDEBUG_MODE=off vendor/bin/phpunit --testdox --log-junit test-results/phpunit.xml
      - name: Publish PHPUnit report
        if: ${{ !cancelled() && inputs.ref == '' && hashFiles('test-results/phpunit.xml') != '' }}
        uses: dorny/test-reporter@v1
        with:
          name: PHPUnit results
          path: test-results/phpunit.xml
          reporter: java-junit
          fail-on-error: true
      - name: Upload PHPUnit report
        if: ${{ !cancelled() && hashFiles('test-results/phpunit.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-report
          path: test-results/phpunit.xml

  playwright:
    name: Playwright (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      checks: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/test-dependencies
        with:
          node: 'true'
          php: 'true'
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build CSS and JavaScript
        run: npm run build
      - name: Run Playwright
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/playwright.xml
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=html,junit
      - name: Publish Playwright report
        if: ${{ !cancelled() && inputs.ref == '' && hashFiles('test-results/playwright.xml') != '' }}
        uses: dorny/test-reporter@v1
        with:
          name: Playwright results (${{ matrix.shard }}/4)
          path: test-results/playwright.xml
          reporter: java-junit
          fail-on-error: true
      - name: Upload Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results
          if-no-files-found: warn
      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ matrix.shard }}
          path: playwright-report
          if-no-files-found: warn

  js-console:
    name: Built JavaScript validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/test-dependencies
        with:
          node: 'true'
          php: 'true'
      - name: Build CSS and JavaScript
        run: npm run build
      - name: Validate built JavaScript
        run: npm run test:js-console-validator

  css-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/test-dependencies
        with:
          node: 'true'
          php: 'true'
      - name: Build CSS bundles
        run: npm run build
      - name: Run W3C CSS validation
        run: |
          mkdir -p test-results
          set -o pipefail
          npm run test:css-validator 2>&1 | tee test-results/w3c-css-validation.log
      - name: Upload CSS validation report
        if: ${{ !cancelled() && hashFiles('test-results/w3c-css-validation.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: w3c-css-validation-report
          path: test-results/w3c-css-validation.log
      - name: Write CSS validation summary
        if: ${{ !cancelled() && hashFiles('test-results/w3c-css-validation.log') != '' }}
        run: |
          {
            echo '## W3C CSS validation'
            echo ''
            echo '<details><summary>W3C validator output (last 120 lines)</summary>'
            echo ''
            echo '```text'
            tail -n 120 test-results/w3c-css-validation.log
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    if: ${{ always() }}
    needs: [jest, typecheck, stylelint, phpunit, playwright, js-console, css-validation]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Summarize and require all checks
        env:
          JEST: ${{ needs.jest.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          STYLELINT: ${{ needs.stylelint.result }}
          PHPUNIT: ${{ needs.phpunit.result }}
          PLAYWRIGHT: ${{ needs.playwright.result }}
          JS_CONSOLE: ${{ needs.js-console.result }}
          CSS_VALIDATION: ${{ needs.css-validation.result }}
        run: |
          {
            echo '## Test report'
            echo ''
            echo '| Suite | Status |'
            echo '| --- | --- |'
            echo "| Jest | $JEST |"
            echo "| TypeScript | $TYPECHECK |"
            echo "| Stylelint | $STYLELINT |"
            echo "| PHPUnit | $PHPUNIT |"
            echo "| Playwright shards | $PLAYWRIGHT |"
            echo "| Built JavaScript validation | $JS_CONSOLE |"
            echo "| W3C CSS validation | $CSS_VALIDATION |"
            echo ''
            echo 'Download the suite-specific artifacts for detailed reports.'
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$JEST" "$TYPECHECK" "$STYLELINT" "$PHPUNIT" "$PLAYWRIGHT" "$JS_CONSOLE" "$CSS_VALIDATION"; do
            if [ "$result" != success ]; then
              echo "::error::At least one test suite did not succeed."
              exit 1
            fi
          done

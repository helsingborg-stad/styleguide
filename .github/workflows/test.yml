name: Test

on:
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 24.6
        cache: 'npm'
        cache-dependency-path: ./package-lock.json

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer:v2

    - name: Install composer packages
      id: composer_install
      run: composer i

    - name: Configure npm for GitHub Packages
      if: ${{ !cancelled() }}
      run: |
        echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
        echo "@helsingborg-stad:registry=https://npm.pkg.github.com" >> .npmrc

    - name: Install npm packages
      id: npm_install
      if: ${{ !cancelled() }}
      run: npm ci

    - name: Install Playwright Chromium
      id: playwright_install
      if: ${{ !cancelled() && steps.npm_install.outcome == 'success' }}
      run: npx playwright install --with-deps chromium

    - name: Run tests (Jest)
      if: ${{ !cancelled() && steps.npm_install.outcome == 'success' }}
      run: npm test

    - name: Run typecheck (TypeScript)
      if: ${{ !cancelled() && steps.npm_install.outcome == 'success' }}
      run: npm run typecheck

    - name: Run Tests (PHPUnit)
      if: ${{ !cancelled() && steps.composer_install.outcome == 'success' }}
      run: composer test

    - name: Build CSS
      id: build
      if: ${{ !cancelled() && steps.npm_install.outcome == 'success' }}
      run: npm run build

    - name: Run Playwright e2e tests
      if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.composer_install.outcome == 'success' && steps.playwright_install.outcome == 'success' }}
      run: npm run test:e2e

    - name: Run built JS console validation
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: npm run test:js-console-validator

    - name: Run CSS linting (Stylelint)
      if: ${{ !cancelled() && steps.npm_install.outcome == 'success' }}
      run: npm run lint:scss

  css-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 24.6
        cache: 'npm'
        cache-dependency-path: ./package-lock.json

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer:v2

    - name: Install composer packages
      run: composer i

    - name: Configure npm for GitHub Packages
      run: |
        echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
        echo "@helsingborg-stad:registry=https://npm.pkg.github.com" >> .npmrc

    - name: Install npm packages
      run: npm ci

    - name: Build all CSS bundles
      run: npm run build

    - name: Run CSS validation (W3C)
      run: npm run test:css-validator

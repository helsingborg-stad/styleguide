name: Test

on:
  push:
    branches: [main-1.x]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit to test; empty uses the triggering ref
        type: string
        default: ''

permissions:
  checks: write
  contents: read
  packages: read

jobs:
  node:
    uses: ./.github/workflows/test-node.yml
    with:
      source_sha: ${{ inputs.source_sha || '' }}

  php:
    uses: ./.github/workflows/test-php.yml
    with:
      source_sha: ${{ inputs.source_sha || '' }}

  browser:
    uses: ./.github/workflows/test-browser.yml
    with:
      source_sha: ${{ inputs.source_sha || '' }}

  built-output:
    uses: ./.github/workflows/test-built-output.yml
    with:
      source_sha: ${{ inputs.source_sha || '' }}

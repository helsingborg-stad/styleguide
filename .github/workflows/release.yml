name: Publish source-tagged Composer release

on:
  push:
    branches: [main-1.x]
    tags: ['*']
  workflow_dispatch:

concurrency:
  group: styleguide-release-main-1.x
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main-1.x'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version files on main-1.x
        uses: helsingborg-stad/release-wp-plugin-action@616213a13c430f4fa7cf1c066630aa17f04eb692
        with:
          php-version: 8.3
          node-version: 24.3.0
          skip-release: true

      - name: Capture the versioned source commit
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          git diff --exit-code
          test "$(git ls-remote origin refs/heads/main-1.x | cut -f1)" = "$(git rev-parse HEAD)"

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Configure npm for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
          echo "@helsingborg-stad:registry=https://npm.pkg.github.com" >> .npmrc

      - name: Install build dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          composer config --global github-oauth.github.com "$GH_TOKEN"
          composer install --no-interaction --prefer-dist
          npm ci --ignore-scripts

      - name: Check the exact source commit
        run: |
          composer test
          npm run typecheck
          npm test -- --watch=false
          python3 -m unittest discover -s scripts -p 'test_image_release.py'

      - name: Build and verify the Composer ZIP
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          npm run build
          python3 -m unittest discover -s scripts -p 'test_release_package.py'
          python3 scripts/release_package.py create "$RUNNER_TEMP/styleguide-$VERSION.zip"
          python3 scripts/release_package.py check "$RUNNER_TEMP/styleguide-$VERSION.zip"
          bash scripts/test_composer_dist.sh "$RUNNER_TEMP/styleguide-$VERSION.zip" "$VERSION"
          test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.sha }}"

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: bash scripts/publish_release.sh "$VERSION" "$SOURCE_SHA" "$RUNNER_TEMP/styleguide-$VERSION.zip" "$GITHUB_REPOSITORY"

  image:
    needs: release
    if: always() && ((github.ref == 'refs/heads/main-1.x' && needs.release.result == 'success') || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.sha || github.ref }}
          fetch-depth: 0

      - name: Verify the semver tag and source
        id: image
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: bash scripts/image_release.sh

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: steps.image.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.image.outputs.publish == 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.image.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.image.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
          secret-envs: github_token=GH_TOKEN

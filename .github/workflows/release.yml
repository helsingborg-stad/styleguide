name: Release

on:
  push:
    branches:
      - main-1.x

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate and apply the next semantic version
        id: version
        uses: helsingborg-stad/release-wp-plugin-action@main
        with:
          node-version: "24.6"

      - name: Set up PHP
        if: steps.version.outputs.release == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Configure npm for GitHub Packages
        if: steps.version.outputs.release == 'true'
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
          echo "@helsingborg-stad:registry=https://npm.pkg.github.com" >> .npmrc

      - name: Commit release metadata to main
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "CI Release Bot"
          git config user.email "ci@helsingborg.se"
          git add version.json composer.json package.json package-lock.json ./*.php
          git commit -m "chore(main-1.x): release $VERSION"
          git push origin HEAD:main-1.x

      - name: Create the built release branch
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git checkout -B release
          php build.php --cleanup --release
          git rm -r --cached .
          git add -f assets source component-design-tokens.json version.json composer.json composer.lock LICENSE README.md
          git commit -m "Release build $VERSION"
          git push origin HEAD:release --force

      - name: Tag the built release commit
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

name: Release

on:
  push:
    branches:
      - main-1.x

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Create release PR or release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          target-branch: main-1.x

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release branch
        run: git checkout -B release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.3.0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Configure npm for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
          echo "@helsingborg-stad:registry=https://npm.pkg.github.com" >> .npmrc

      - name: Run PHP build script
        run: php build.php --no-composer --cleanup --release

      - name: Remove cached git files
        run: |
          git rm -r --cached .

      - name: Overwrite .gitignore for release branch
        run: |
          cat > .gitignore <<'EOF'
          /*
          !/assets
          !/source
          !/component-design-tokens.json
          !/composer.json
          !/composer.lock
          !/LICENSE
          !/README.md
          EOF

      # --- Release Branch Commit ---
      - name: Commit and push release branch
        run: |
          git config user.name "CI Release Bot"
          git config user.email "ci@helsingborg.se"
          git add .
          git commit -m "Release build from $GITHUB_SHA" || echo "No changes to commit"
          git push origin release --force

      # --- Move release-please tag to the built release commit ---
      - name: Move tag to release branch
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          git tag -f "$TAG"
          git push origin "refs/tags/$TAG" --force
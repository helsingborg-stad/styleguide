name: Test built output

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''

jobs:
  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.6
          cache: npm
          cache-dependency-path: ./package-lock.json
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Configure npm for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
          echo "@helsingborg-stad:registry=https://npm.pkg.github.com" >> .npmrc
      - run: npm ci
      - name: Build CSS and JavaScript
        run: npm run build
      - name: Run built JavaScript console validation
        id: js_console
        continue-on-error: true
        run: npm run test:js-console-validator
      - name: Run W3C CSS validation
        id: w3c_css
        continue-on-error: true
        run: |
          mkdir -p test-results
          set -o pipefail
          npm run test:css-validator 2>&1 | tee test-results/w3c-css-validation.log
      - name: Upload CSS validation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: w3c-css-validation-report
          path: test-results/w3c-css-validation.log
          if-no-files-found: warn
      - name: Write built-output validation summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '## Built-output validation'
            echo '| Suite | Status |'
            echo '| --- | --- |'
            echo '| JavaScript console | ${{ steps.js_console.outcome }} |'
            echo '| W3C CSS validator | ${{ steps.w3c_css.outcome }} |'
            if [ -f test-results/w3c-css-validation.log ]; then
              echo ''
              echo '<details><summary>W3C validator output (last 120 lines)</summary>'
              echo ''
              echo '```text'
              tail -n 120 test-results/w3c-css-validation.log
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when a validator failed
        if: ${{ !cancelled() }}
        run: |
          test "${{ steps.js_console.outcome }}" = success
          test "${{ steps.w3c_css.outcome }}" = success

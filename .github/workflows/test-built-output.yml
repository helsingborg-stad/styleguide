name: Test built output

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''

jobs:
  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ inputs.source_sha == '' }}
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ inputs.source_sha != '' }}
        with:
          ref: refs/heads/main-1.x
          persist-credentials: false
      - name: Verify release source
        if: ${{ inputs.source_sha != '' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.6
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Install npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/styleguide-npmrc
        run: |
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' '@helsingborg-stad:registry=https://npm.pkg.github.com' > "$NPM_CONFIG_USERCONFIG"
          npm ci --ignore-scripts
      - name: Build CSS and JavaScript
        run: npm run build
      - name: Run built JavaScript console validation
        id: js_console
        continue-on-error: true
        run: npm run test:js-console-validator
      - name: Run W3C CSS validation
        id: w3c_css
        continue-on-error: true
        run: |
          mkdir -p test-results
          set -o pipefail
          npm run test:css-validator 2>&1 | tee test-results/w3c-css-validation.log
      - name: Upload CSS validation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w3c-css-validation-report
          path: test-results/w3c-css-validation.log
          if-no-files-found: warn
      - name: Write built-output validation summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '## Built-output validation'
            echo '| Suite | Status |'
            echo '| --- | --- |'
            echo '| JavaScript console | ${{ steps.js_console.outcome }} |'
            echo '| W3C CSS validator | ${{ steps.w3c_css.outcome }} |'
            if [ -f test-results/w3c-css-validation.log ]; then
              echo ''
              echo '<details><summary>W3C validator output (last 120 lines)</summary>'
              echo ''
              echo '```text'
              tail -n 120 test-results/w3c-css-validation.log
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when a validator failed
        if: ${{ !cancelled() }}
        run: |
          test "${{ steps.js_console.outcome }}" = success
          test "${{ steps.w3c_css.outcome }}" = success

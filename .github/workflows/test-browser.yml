name: Test browser

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''

jobs:
  playwright:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.6
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Install npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/styleguide-npmrc
        run: |
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' '@helsingborg-stad:registry=https://npm.pkg.github.com' > "$NPM_CONFIG_USERCONFIG"
          npm ci --ignore-scripts
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build CSS and JavaScript
        run: npm run build
      - name: Run Playwright
        id: playwright
        continue-on-error: true
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/playwright.xml
        run: |
          mkdir -p test-results
          ./node_modules/.bin/playwright test --reporter=html,junit
      - name: Publish Playwright report
        if: ${{ !cancelled() && inputs.source_sha == '' && hashFiles('test-results/playwright.xml') != '' }}
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        with:
          name: Playwright results
          path: test-results/playwright.xml
          reporter: java-junit
          fail-on-error: false
      - name: Upload Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: warn
      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-html-report
          path: playwright-report
          if-no-files-found: warn
      - name: Fail when Playwright failed
        if: ${{ !cancelled() && steps.playwright.outcome != 'success' }}
        run: exit 1
